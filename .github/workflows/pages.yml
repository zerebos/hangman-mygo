# Builds the browser version of the game and publishes it to GitHub Pages on
# every push to main. The repository's Settings > Pages > Source must be set
# to "GitHub Actions".
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write # to publish the site
  id-token: write # deploy-pages proves where the site came from with it

# One deploy at a time. A newer push waits rather than cancelling one that is
# halfway through publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test
        run: go vet ./... && go test ./...
      # mygo's CLI is pinned in go.mod as a tool, so this needs nothing else.
      # It writes a static site to build/web.
      - name: Build for browsers
        run: go tool mygo build -platform web
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
